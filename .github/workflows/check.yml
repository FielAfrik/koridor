name: Contrôler la veille

# Vérifie chaque pull request avant que le rédacteur en chef ne la valide.
on:
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Contrôler les données
        run: python3 scripts/validate.py
      - name: Générer le site
        run: python3 site/build.py
